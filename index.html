<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Своя игра — пульт ведущего</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800;900&display=swap">
<style>
:root{
  --bg:#121418;
  --panel:#1a1d23;
  --panel-2:#23272f;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.17);
  --text:#f3f4f6;
  --muted:#b0b6c0;
  --faint:#9299a5;
  --blue:#3a404b;
  --blue-hi:#4a515e;
  --gold:#ffc83a;
  --gold-ink:#1d1400;
  --up:#33e391;
  --down:#ff5a6e;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --f-display:"Unbounded","Golos Text",sans-serif;
  --f-text:"Golos Text","Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--f-text);overflow:hidden}
::selection{background:var(--gold);color:var(--gold-ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px;border:3px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
svg.i{width:18px;height:18px;flex:none}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0d0f12}
.brand{font:800 15px/1 var(--f-display);color:var(--gold);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;margin-top:5px;font:500 12px/1 var(--f-text);color:var(--faint);text-transform:none;letter-spacing:0}
.status{margin-left:8px;padding:6px 12px;border-radius:8px;background:var(--panel);font:600 13px/1 var(--f-text);color:var(--muted);white-space:nowrap}
.status b{color:var(--text)}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--line-2);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s, transform .1s, box-shadow .15s}
.btn:hover{background:#2e333c}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--blue);box-shadow:none}
.btn.primary:hover{background:var(--blue-hi)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:none}
.btn.gold:hover{background:#ffd666}
.btn.ghost{background:transparent}
.btn.big{height:46px;padding:0 20px;font-size:15px}
.btn.ok{background:rgba(51,227,145,.14);color:var(--up);box-shadow:inset 0 0 0 1px rgba(51,227,145,.45)}
.btn.ok:hover{background:rgba(51,227,145,.24)}
.btn.no{background:rgba(255,90,110,.12);color:var(--down);box-shadow:inset 0 0 0 1px rgba(255,90,110,.45)}
.btn.no:hover{background:rgba(255,90,110,.22)}
.btn.on{box-shadow:inset 0 0 0 2px var(--gold)}
kbd{font:600 11px/1 var(--f-data);padding:3px 5px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--muted)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;padding:14px 16px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.col > .panel{flex:none}
.col > .panel.qp{flex:1 1 auto;min-height:0}
.main > .col:last-child{overflow:hidden}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0}
.ph h2{font:700 13px/1 var(--f-text);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* mini board */
.mb{padding:12px 14px 14px;display:grid;gap:6px}
.mb-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,1fr));gap:6px}
.mb-theme{font:600 12.5px/1.2 var(--f-text);color:var(--muted);display:flex;align-items:center;padding-right:6px;text-wrap:balance}
.mb-cell{position:relative;height:42px;border-radius:7px;background:linear-gradient(180deg,#191c21 0 50%,#111317 50% 100%);
  font:800 14px/1 var(--f-display);color:var(--gold);display:grid;place-items:center;transition:transform .12s, filter .12s}
.mb-cell:hover{filter:brightness(1.25)}
.mb-cell:active{transform:scale(.97)}
.mb-cell.played{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint);font-weight:600;text-decoration:line-through;opacity:.55}
.mb-cell.current{box-shadow:0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.4)}
.mb-cell .sp{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:5px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.mb-cell .sp svg{width:11px;height:11px}
.mb-cell.played .sp{opacity:.5}

/* preview */
.pv{padding:12px 14px 14px}
.pv-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0d0f12;box-shadow:inset 0 0 0 1px var(--line)}
.pv-frame iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}

/* question panel */
.qp{flex:1;display:flex;flex-direction:column;overflow:hidden}
.qp-body{flex:1;overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.qp-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);padding:30px}
.qp-empty p{max-width:380px}
.qp-empty b{color:var(--text)}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;background:var(--panel-2);font:600 12.5px/1 var(--f-text);color:var(--muted)}
.tag.gold{background:rgba(255,200,58,.14);color:var(--gold)}
.tag.price{font:800 13px/1 var(--f-display);color:var(--gold)}
.qtext{font:500 19px/1.4 var(--f-text)}
.qitems{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:15px}
.qitems li{display:flex;gap:10px;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.04)}
.qitems li b{font-family:var(--f-data);color:var(--gold);min-width:46px}
.answer{padding:14px 16px;border-radius:10px;background:rgba(255,200,58,.10);box-shadow:inset 0 0 0 1px rgba(255,200,58,.35)}
.answer .lbl{font:700 11.5px/1 var(--f-text);color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.answer .txt{margin-top:7px;font:700 20px/1.3 var(--f-text);color:#ffe7a6}
.src{font-size:13.5px;color:var(--muted)}
.src b{color:var(--text);font-weight:600}
.note{font-size:13.5px;color:var(--muted);padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.04)}
.hintbox{font-size:14px;color:#ffe7a6;padding:10px 12px;border-radius:9px;background:rgba(255,200,58,.07)}
.qp-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.step{padding:12px 14px;border-radius:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:10px}
.step h3{font:700 14px/1.2 var(--f-text)}
.step p{font-size:13.5px;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;align-items:center;gap:8px}
.field input{width:130px;height:36px;padding:0 10px;border-radius:8px;background:#0b0d11;border:1px solid var(--line-2);font-family:var(--f-data)}

/* timer */
.timerbox{display:flex;align-items:center;gap:8px;padding:0 18px 12px;flex-wrap:wrap}
.tval{font:700 26px/1 var(--f-data);font-variant-numeric:tabular-nums;min-width:56px}
.tval.low{color:var(--down)}

/* teams */
.teams{display:flex;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line);background:#0d0f12;overflow-x:auto}
.tm{flex:1;min-width:190px;padding:10px 12px;border-radius:11px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.tm.chooser{box-shadow:inset 0 0 0 2px var(--gold)}
.tm-top{display:flex;align-items:center;gap:8px}
.tm-n{flex:1;min-width:0;font:600 14px/1.2 var(--f-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-k{font:600 11px/1 var(--f-data);color:var(--faint)}
.tm-s{font:700 24px/1 var(--f-data);font-variant-numeric:tabular-nums}
.tm-s.neg{color:var(--down)}
.tm-b{display:flex;gap:6px}
.tm-b .btn{flex:1;height:32px;padding:0 8px;justify-content:center;font-size:13px}
.tm-b .btn.sq{flex:none;width:32px;padding:0}
.chooserbtn{font:600 11px/1 var(--f-text);color:var(--faint);padding:4px 6px;border-radius:5px}
.tm.chooser .chooserbtn{color:var(--gold-ink);background:var(--gold)}

/* setup */
.setup{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:
  #1a1d23;padding:24px}
.setup.hide{display:none}
.su{width:min(640px,100%);display:flex;flex-direction:column;gap:22px}
.su h1{font:900 64px/.95 var(--f-display);color:var(--gold);text-transform:uppercase;letter-spacing:-.03em}
.su .lead{font-size:17px;color:var(--muted);margin-top:-6px}
.su-card{padding:20px;border-radius:16px;background:#23272f;box-shadow:inset 0 0 0 1px var(--line-2);display:flex;flex-direction:column;gap:14px}
.su-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.su-row label{font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper span{font:700 20px/1 var(--f-data);min-width:30px;text-align:center}
.names{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr) 96px;gap:8px}
.names input{min-width:0;height:42px;padding:0 12px;border-radius:9px;background:#0b0d11;border:1px solid var(--line-2)}
.names input.tk{font:700 16px/1 var(--f-data);text-transform:uppercase;letter-spacing:.08em;color:var(--gold);text-align:center}
.names input::placeholder{color:var(--faint)}
.su-help{font-size:13.5px;color:var(--muted);line-height:1.6}
.su-actions{display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:10px;background:#2e333c;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;transition:all .3s var(--ease-out);pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.main{grid-template-columns:1fr;overflow:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Своя игра<small>Пульт ведущего</small></div>
    <div class="status" id="status"></div>
    <div class="spacer"></div>
    <button class="btn primary" id="btnScreen"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Экран для проектора</button>
    <button class="btn" id="btnSummary">Итоги сессии</button>
    <button class="btn" id="btnNext">Следующий раунд</button>
    <button class="btn" id="btnFinal">К финалу</button>
    <button class="btn" id="btnEnd">Завершить игру</button>
    <button class="btn ghost" id="btnSound" title="Звук"></button>
    <button class="btn ghost" id="btnUndo" title="Отменить последнее начисление">Отменить</button>
  </header>

  <main class="main">
    <div class="col">
      <section class="panel">
        <div class="ph"><h2 id="boardTitle">Табло</h2><button class="btn ghost" id="btnBoard" style="height:28px">Показать табло</button></div>
        <div class="mb" id="mb"></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>Что видит зал</h2></div>
        <div class="pv"><div class="pv-frame" id="pvFrame"><iframe id="pv" src="screen.html" title="Превью экрана"></iframe></div></div>
      </section>
    </div>

    <div class="col">
      <section class="panel qp">
        <div class="ph"><h2>Текущий вопрос</h2><div class="tag" id="viewTag"></div></div>
        <div class="qp-body" id="qp"></div>
        <div class="timerbox" id="timerbox">
          <span class="tval" id="tval">—</span>
          <button class="btn" data-t="15">15 с</button>
          <button class="btn" data-t="30">30 с</button>
          <button class="btn" data-t="60">60 с</button>
          <button class="btn" id="tToggle">Пауза <kbd>Пробел</kbd></button>
          <button class="btn ghost" id="tReset">Сброс</button>
        </div>
        <div class="qp-actions" id="qa"></div>
      </section>
    </div>
  </main>

  <footer class="teams" id="teams"></footer>
</div>

<div class="setup" id="setup">
  <div class="su">
    <div>
      <h1>Своя<br>игра</h1>
    </div>
    <p class="lead" id="suLead"></p>
    <div class="su-card">
      <div class="su-row"><label>Количество команд</label>
        <div class="stepper"><button class="btn sq" id="suMinus" style="width:36px;padding:0;justify-content:center">−</button><span id="suCount">3</span><button class="btn" id="suPlus" style="width:36px;padding:0;justify-content:center">+</button></div>
      </div>
      <div class="names" id="suNames"></div>
    </div>
    <div class="su-help">
      1. Нажмите «Экран для проектора» и перетащите окно на проектор, там нажмите <kbd>F</kbd>.<br>
      2. Клавиши на пульте: <kbd>Пробел</kbd> таймер, <kbd>Enter</kbd> ответ, <kbd>Esc</kbd> на табло, <kbd>1</kbd>–<kbd>6</kbd> верно, <kbd>Shift</kbd>+<kbd>1</kbd>–<kbd>6</kbd> неверно.
    </div>
    <div class="su-actions">
      <button class="btn gold big" id="suStart">Начать игру</button>
      <button class="btn big" id="suScreen">Экран для проектора</button>
      <button class="btn big ghost" id="suResume" style="display:none">Продолжить сохранённую игру</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="questions.js"></script>
<script>
(() => {
  const D = window.GAME;
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ru-RU').replace(/ /g, ' ');

  const ICON = {
    cat: '<circle cx="12" cy="12" r="9"/><path d="M3.5 13.5c2.2-1.6 4.4-1.6 6.6 0s4.4 1.6 6.6 0 2.9-1.2 3.8-.6"/><circle cx="12" cy="8" r="1.4" fill="currentColor"/>',
    auction: '<path d="M14.5 3.5l6 6"/><path d="M11 7l6 6"/><path d="M12.75 5.25l-4.5 4.5 6 6 4.5-4.5"/><path d="M10.5 12 3.5 19"/>',
    reg: '<path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/>',
    order: '<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>'
  };
  const svg = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

  const REG = {
    stress:  { title: 'Стресс-тест', rule: 'На ответ — всего 15 секунд.' },
    insider: { title: 'Инсайдерская информация', rule: 'Можно взять подсказку. Ошибка после подсказки — минус вдвое.' },
    revoke:  { title: 'Отзыв лицензии', rule: 'Клетка сгорает. Очков никто не получает, ход переходит к следующей команде.' },
    order:   { title: 'Предписание Банка России', rule: 'Отвечает только команда, выбравшая вопрос. Ошибка — минус стоимость.' }
  };
  const SPECIAL = {
    cat: { title: 'Тёмный пул · кот в мешке', rule: 'Вопрос из другой темы. Выбирающая команда передаёт его любой другой команде.' },
    auction: { title: 'Аукцион открытия', rule: 'Команды торгуются за право ответить. Ставка — не меньше стоимости вопроса.' },
    box: { title: 'Чёрный ящик', rule: 'Выбравшая команда решает, не видя вопроса: продать ящик не глядя за половину цены или открыть — верно +цена, неверно −цена.' }
  };
  const specTitle = sp => sp.kind === 'reg' ? REG[sp.card].title : SPECIAL[sp.kind].title;

  /* ================= tickers ================= */
  const TR = { а:'A',б:'B',в:'V',г:'G',д:'D',е:'E',ё:'E',ж:'ZH',з:'Z',и:'I',й:'Y',к:'K',л:'L',м:'M',н:'N',о:'O',п:'P',р:'R',с:'S',т:'T',у:'U',ф:'F',х:'H',ц:'C',ч:'CH',ш:'SH',щ:'SH',ъ:'',ы:'Y',ь:'',э:'E',ю:'U',я:'YA' };
  function makeTicker(name, taken) {
    const lat = [...name.toLowerCase()].map(c => TR[c] ?? (/[a-z0-9]/.test(c) ? c.toUpperCase() : '')).join('');
    if (!lat) return uniq('TEAM', taken);
    const cons = lat[0] + lat.slice(1).replace(/[AEIOUY]/g, '');
    let t = (cons.length >= 4 ? cons : lat).slice(0, 4).padEnd(4, 'X');
    return uniq(t, taken);
  }
  function uniq(t, taken) { let u = t, n = 1; while (taken.includes(u)) u = t.slice(0, 3) + (n++); return u; }

  /* ================= state ================= */
  const SOLO = new URLSearchParams(location.search).has('solo') && window.parent !== window;
  const MEDIA_KIND = { chart: 'график', picture: 'картинка', scheme: 'схема', book: 'стакан заявок', tf: 'верно / неверно', pyramid: 'пирамида норм', mega: 'карта мегарегулятора', day: 'торговый день', fund: 'устройство ПИФа' };
  const KEY = SOLO ? 'svoya-igra-solo-v2' : 'svoya-igra-state-v2';
  let G = fresh();
  function fresh() {
    return { view: 'setup', roundIdx: 0, teams: [], chooser: 0, played: {}, cellInfo: {}, cur: null, index: [],
             timer: { dur: 0, remaining: 0, endsAt: null }, final: null, history: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }

  const round = () => D.rounds[G.roundIdx];
  const qOf = (ti, i) => round().themes[ti].questions[i];
  const ck = (ti, i) => `${G.roundIdx}-${ti}-${i}`;
  const total = () => G.teams.reduce((s, t) => s + t.score, 0);
  const tk = i => G.teams[i] ? G.teams[i].ticker : '';

  /* ================= sound ================= */
  let AC = null, soundOn = true;
  try { soundOn = localStorage.getItem('svoya-sound') !== 'off'; } catch (e) {}
  function ac() {
    if (SOLO) return null; if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
  function tone(f, d, { type = 'sine', vol = .14, at = 0, to = null } = {}) {
    if (SOLO) { window.parent.postMessage({ type: 'snd', fn: 'tone', args: [f, d, { type, vol, at, to }] }, '*'); return; }
    if (!soundOn) return;
    const a = ac(), t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
  }
  function noise(d, { at = 0, vol = .2, freq = 1800 } = {}) {
    if (SOLO) { window.parent.postMessage({ type: 'snd', fn: 'noise', args: [d, { at, vol, freq }] }, '*'); return; }
    if (!soundOn) return;
    const a = ac(), t = a.currentTime + at, len = Math.floor(a.sampleRate * d), b = a.createBuffer(1, len, a.sampleRate), ch = b.getChannelData(0);

    f.closed = true;
  }
  function toWinner() { if (G.cur) closeQuestion(true); stopTimer(true); closeFinalCandles(); G.view = 'winner'; sfx.flaps(8); setTimeout(sfx.win, 380); commit(); }

  /* ---------- timer ---------- */
  let tInt = 0, lastTick = -1;
  function startTimer(sec, silent) { G.timer = { dur: sec, remaining: sec, endsAt: Date.now() + sec * 1000 }; loopTimer(); if (!silent) commit(); }
  function toggleTimer() {
    const t = G.timer;
    if (!t.dur) { startTimer(30); return; }
    if (t.endsAt) { t.remaining = Math.max(0, (t.endsAt - Date.now()) / 1000); t.endsAt = null; }
    else if (t.remaining > 0) { t.endsAt = Date.now() + t.remaining * 1000; loopTimer(); }
    else { startTimer(t.dur); return; }
    commit();
  }
  function stopTimer(clear) {
    const t = G.timer;
    if (t.endsAt) { t.remaining = Math.max(0, (t.endsAt - Date.now()) / 1000); t.endsAt = null; }
    if (clear) G.timer = { dur: 0, remaining: 0, endsAt: null };
  }
  function loopTimer() {
    clearInterval(tInt);
    tInt = setInterval(() => {
      const t = G.timer;
      if (!t.endsAt) { clearInterval(tInt); renderTimer(); return; }
      const rem = (t.endsAt - Date.now()) / 1000, s = Math.ceil(rem);
      if (s !== lastTick && s <= 5 && s > 0) sfx.tick();
      lastTick = s;
      if (rem <= 0) { t.endsAt = null; t.remaining = 0; clearInterval(tInt); sfx.breaker(); setTimeout(sfx.gong, 250); commit(); return; }
      renderTimer();
    }, 100);
  }
  function renderTimer() {
    const t = G.timer, el = $('tval');
    if (!t.dur) { el.textContent = '—'; el.classList.remove('low'); $('tToggle').innerHTML = 'Старт <kbd>Пробел</kbd>'; return; }
    const rem = t.endsAt ? Math.max(0, (t.endsAt - Date.now()) / 1000) : t.remaining;
    el.textContent = Math.ceil(rem) + ' с'; el.classList.toggle('low', rem <= 5);
    $('tToggle').innerHTML = (t.endsAt ? 'Пауза' : rem > 0 ? 'Продолжить' : 'Заново') + ' <kbd>Пробел</kbd>';
  }

  /* ================= render (console) ================= */
  function render() {
    const r = round();
    const names = { setup: 'Настройка', intro: 'Заставка', roundIntro: 'Колокол и темы', board: 'Табло', news: 'Срочная новость', question: 'Вопрос', summary: 'Итоги сессии', final: 'Финал', winner: 'IPO победителя' };
    $('status').innerHTML = `<b>${esc(r.name)}</b> · ${esc(r.title)}`;
    $('viewTag').textContent = 'На экране: ' + names[G.view];
    $('boardTitle').textContent = `Табло · ${r.name}`;
    $('btnNext').disabled = G.roundIdx >= D.rounds.length - 1 && G.view !== 'intro';
    $('btnSound').textContent = soundOn ? 'Звук вкл' : 'Звук выкл';
    $('btnBoard').textContent = G.view === 'intro' ? 'Открыть торги' : G.view === 'roundIntro' ? 'Показать табло' : 'На табло';
    $('mb').innerHTML = r.themes.map((t, ti) => `<div class="mb-row"><div class="mb-theme">${esc(t.name)}</div>${t.questions.map((q, i) => {
      const k = ck(ti, i), sp = q.special, inf = G.cellInfo[k];
      const ic = sp ? `<span class="sp" title="${specTitle(sp)}">${svg(sp.kind)}</span>` : q.type === 'order' ? `<span class="sp" title="Расставить по порядку">${svg('order')}</span>` : '';
      const lbl = G.played[k] ? (inf && inf.by != null ? tk(inf.by) : '—') : q.price;
      return `<button class="mb-cell${G.played[k] ? ' played' : ''}${G.cur && G.cur.key === k ? ' current' : ''}" data-ti="${ti}" data-i="${i}">${lbl}${ic}</button>`;
    }).join('')}</div>`).join('');
    renderQP(); renderTeams(); renderTimer();
  }

    if (G.view === 'final') return renderFinalQP(qp, qa);

      html += `<div class="qtext" style="opacity:.6">${esc(text)}</div><div class="answer"><div class="lbl">Ответ</div><div class="txt">${esc(ans)}</div></div>`;

        <div class="pick">${G.teams.map((t, i) => `<button class="btn${f.buzz === i ? ' on' : ''}" data-fbuzz="${i}" ${f.out.includes(i) || (f.buzz != null && f.buzz !== i) || c.answerShown ? 'disabled' : ''}>${esc(t.ticker)} отвечает</button>`).join('')}
        <button class="btn ghost" data-act="fallPause" ${f.buzz != null || c.answerShown ? 'disabled' : ''}>${f.paused ? 'Продолжить' : 'Пауза'}</button></div></div>`;
    }
    html += `<div class="answer"><div class="lbl">Ответ${c.answerShown ? ' · показан залу' : ''}</div><div class="txt">${esc(ans)}</div></div>`;

  }

  /* ================= events ================= */
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    ac();
    if (b.dataset.ti != null) return openCell(+b.dataset.ti, +b.dataset.i);
    if (b.dataset.fbuzz != null) return fallBuzz(+b.dataset.fbuzz);
    if (b.dataset.j != null) return judge(+b.dataset.j, b.dataset.ok === '1');
    if (b.dataset.fj != null) return judgeFinal(+b.dataset.fj, b.dataset.ok === '1');
    if (b.dataset.m != null) return manual(+b.dataset.m, +b.dataset.d);
    if (b.dataset.chooser != null) { G.chooser = +b.dataset.chooser; return commit(); }
    if (b.dataset.pick != null) { G.cur.answering = +b.dataset.pick; return commit(); }
    if (b.dataset.bidteam != null) { const q = qOf(G.cur.ti, G.cur.i); G.cur.bid = Math.max(q.price, +($('bid').value || q.price)); G.cur.answering = +b.dataset.bidteam; return commit(); }
    if (b.dataset.t) return startTimer(+b.dataset.t);
    const act = b.dataset.act;
    if (act === 'toQ') return toQuestion();
    if (act === 'reveal') return revealAnswer();
    if (act === 'board') return showBoard();
    if (act === 'roundIntro') return showRoundIntro();
    if (act === 'burn') return burnCell();
    if (act === 'walkNext') return walkNext();
    if (act === 'boxSell') return boxSell();
    if (act === 'boxOpen') return boxOpen();
    if (act === 'fallPause') return fallPause();
    if (act === 'critApply') return judgeCriteria(+b.dataset.team);
    if (act === 'fAuction') { const bid = Math.max(D.final.start || 0, +($('fbid').value || 0)); const t = +b.dataset.team; const f = G.final; f.players = [t]; f.bets = { [t]: bid }; f.betsIn = { [t]: true }; return commit(); }
    if (act === 'fCrit') return judgeFinalCriteria();
    if (act === 'hint') { G.cur.hintShown = true; sfx.news(); return commit(); }
    if (act === 'next') return nextRound();
    if (act === 'final') return toFinal();
    if (act === 'fBets') return finalStage('bets');
    if (act === 'fQ') return finalStage('question');
    if (act === 'fReveal') return finalStage('reveal');
    if (act === 'winner') return toWinner();
    if (act === 'new') { if (confirm('Начать новую игру? Текущий счёт будет потерян.')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.bet != null) {
      const i = +el.dataset.bet, max = Math.max(0, G.teams[i].score);
      G.final.bets[i] = Math.max(0, Math.min(max, +el.value || 0)); G.final.betsIn[i] = el.value !== '';
      save(); send();
    }
  });
  document.addEventListener('change', e => {
    if (e.target.dataset.crit != null) {
      const n = +e.target.dataset.crit;
      if (G.view === 'final' && G.final) { G.final.crit = G.final.crit || {}; G.final.crit[n] = e.target.checked; save(); return; }
      if (G.cur) { G.cur.crit = G.cur.crit || {}; G.cur.crit[n] = e.target.checked; save(); }
      return;
    } if (e.target.dataset.bet != null) { const i = +e.target.dataset.bet; e.target.value = G.final.bets[i]; } });

  $('btnScreen').onclick = openScreen;
  $('suScreen').onclick = openScreen;
  $('btnSummary').onclick = showSummary;
  $('btnNext').onclick = () => { if (G.view === 'intro') return showRoundIntro(); if (confirm('Перейти к следующему раунду?')) nextRound(); };
  $('btnFinal').onclick = () => { if (confirm('Перейти к финалу?')) toFinal(); };
  $('btnEnd').onclick = () => { if (confirm('Завершить игру и показать IPO победителя?')) toWinner(); };
  $('btnBoard').onclick = () => { if (G.view === 'intro') showRoundIntro(); else showBoard(); };
  $('btnUndo').onclick = undo;
  $('btnSound').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('svoya-sound', soundOn ? 'on' : 'off'); } catch (e) {} render(); };
  $('tToggle').onclick = toggleTimer;
  $('tReset').onclick = () => { stopTimer(true); commit(); };

  addEventListener('keydown', e => {
    if (e.target.matches('input, textarea') || G.view === 'setup') return;
    if (e.code === 'Space') { e.preventDefault(); if (G.view === 'question' && G.cur && G.cur.answerShown && qOf(G.cur.ti, G.cur.i).explain) walkNext(); else if (G.view === 'question' || (G.final && G.final.stage === 'question')) toggleTimer(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (G.view === 'question' && G.cur && !G.cur.answerShown) revealAnswer();
      else if (G.view === 'news') { const sp = qOf(G.cur.ti, G.cur.i).special; if ((sp.kind === 'reg' && sp.card !== 'revoke') || sp.kind === 'box') toQuestion(); }
    }
    else if (e.key === 'Escape') { if (G.view === 'question' || G.view === 'news' || G.view === 'summary') showBoard(); }
    else if (/^Digit[1-6]$/.test(e.code)) { const t = +e.code.slice(5) - 1; if (G.view === 'question') judge(t, !e.shiftKey); }
    else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undo(); }
  });

  const pvf = $('pvFrame'), pv = $('pv');
  new ResizeObserver(() => { pv.style.transform = `scale(${pvf.clientWidth / 1920})`; }).observe(pvf);
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400); }

  /* ================= setup ================= */
  let count = 3;
  const names = ['Брокеры', 'Дилеры', 'Регистраторы', 'Депозитарии', 'Маркет-мейкеры', 'Управляющие'];
  const tickers = Array(6).fill(null);
  function autoTickers() {
    const taken = [];
    return names.slice(0, count).map((n, i) => { const t = (tickers[i] || makeTicker(n || `Команда ${i + 1}`, taken)).toUpperCase().slice(0, 4); taken.push(t); return t; });
  }
  function renderSetup() {
    $('suLead').textContent = D.subtitle;
    $('suCount').textContent = count;
    const tks = autoTickers();
    $('suNames').innerHTML = Array.from({ length: count }, (_, i) => `<input data-name="${i}" value="${esc(names[i])}" placeholder="Команда ${i + 1}" maxlength="28" aria-label="Название команды ${i + 1}"><input class="tk" data-tk="${i}" value="${tks[i]}" maxlength="4" aria-label="Тикер команды ${i + 1}">`).join('');
  }
  $('suNames').addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.name != null) {
      names[+el.dataset.name] = el.value;
      const taken = []; const tks = autoTickers();
      $('suNames').querySelectorAll('[data-tk]').forEach((inp, i) => { if (!tickers[i]) inp.value = tks[i]; });
    }
    if (el.dataset.tk != null) { el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); tickers[+el.dataset.tk] = el.value || null; }
  });
  $('suMinus').onclick = () => { count = Math.max(2, count - 1); renderSetup(); };
  $('suPlus').onclick = () => { count = Math.min(6, count + 1); renderSetup(); };
  $('suStart').onclick = () => {
    ac();
    const tks = autoTickers();
    startGame(names.slice(0, count).map((n, i) => [n.trim() || `Команда ${i + 1}`, tks[i] || `T${i + 1}`]));
  };
  const saved = load();
  let canResume = false;
  const resumeSaved = () => { G = saved; if (G.timer) G.timer.endsAt = null; if (G.cur && G.cur.fall) { G.cur.fall.paused = true; startFall(); } $('setup').classList.add('hide'); canResume = false; commit(); };

  /* ---------- commands from the one-screen version (solo.html) ---------- */
  const CMD = {
    start: list => { const taken = []; startGame(list.map((n, i) => { const t = (n.ticker || makeTicker(n.name || `Команда ${i + 1}`, taken)).toUpperCase().slice(0, 4); taken.push(t); return [n.name || `Команда ${i + 1}`, t]; })); },
    resume: () => { if (saved) resumeSaved(); },
    newGame: () => { try { localStorage.removeItem(KEY); } catch (e) {} clearInterval(fallInt); G = fresh(); canResume = false; commit(); },
    roundIntro: () => showRoundIntro(), board: () => showBoard(), summary: () => showSummary(),
    open: (ti, i) => openCell(ti, i, true), toQ: () => toQuestion(), reveal: () => revealAnswer(),
    judge: (t, ok) => judge(t, ok), manual: (t, d) => manual(t, d), undo: () => undo(),
    chooser: t => { G.chooser = t; commit(); },
    pick: t => { if (G.cur && t !== G.cur.chooser) { G.cur.answering = t; commit(); } },
    bid: (t, b) => { if (!G.cur) return; const q = qOf(G.cur.ti, G.cur.i); G.cur.bid = Math.max(q.price, +b || q.price); G.cur.answering = t; commit(); },
    burn: () => burnCell(), hint: () => { if (G.cur) { G.cur.hintShown = true; sfx.news(); commit(); } },
    critApply: (t, ticks) => { if (!G.cur) return; G.cur.crit = ticks || {}; judgeCriteria(t); },
    walkNext: () => walkNext(), boxSell: () => boxSell(), boxOpen: () => boxOpen(), fallBuzz: t => fallBuzz(t), fallPause: () => fallPause(),
    timer: sec => startTimer(sec), timerToggle: () => toggleTimer(), timerReset: () => { stopTimer(true); commit(); },
    next: () => nextRound(), final: () => toFinal(), fStage: st => finalStage(st),
    fAuction: (t, b) => { const f = G.final; if (!f) return; const bid = Math.max(D.final.start || 0, +b || 0); f.players = [t]; f.bets = { [t]: bid }; f.betsIn = { [t]: true }; commit(); },
    fCrit: ticks => { if (!G.final) return; G.final.crit = ticks || {}; judgeFinalCriteria(); },
    fJudge: (t, ok) => judgeFinal(t, ok), winner: () => toWinner()
  };
  addEventListener('message', e => {
    const m = e.data;
    if (!SOLO || !m || m.type !== 'cmd' || e.source !== window.parent) return;
    const fn = CMD[m.name];
    if (fn) fn(...(m.args || []));
  });
  if (saved && saved.teams && saved.teams.length && saved.view !== 'setup') {
    canResume = true;
    $('suResume').style.display = '';
    $('suResume').onclick = resumeSaved;
  }
  renderSetup();
  render();
})();
</script>
</body>
</html>
